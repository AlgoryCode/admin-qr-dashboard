name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Repository & Commit Hash
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_HASH=${GITHUB_SHA::7}
          echo "IMAGE_BASE=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${COMMIT_HASH}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BASE }}:staging
          build-args: |
            NEXT_PUBLIC_MEMBER_APP_URL=https://qr.algorycode.com

      - name: Coolify Image Tagini Commit Hash Olarak Güncelle
        run: |
          curl -f -X PATCH "http://185.184.210.52:8000/api/v1/applications/m10nhwf476xdvrj11qdne96s" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"${{ env.IMAGE_TAG }}\"}"

      - name: Staging Deployunu Tetikle
        run: |
          curl -f "http://185.184.210.52:8000/api/v1/deploy?uuid=m10nhwf476xdvrj11qdne96s&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
